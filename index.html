<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تتبع الألعاب | Game Tracker</title>
    <!-- خط تجوال لدعم العربية بشكل أنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الترويسة -->
    <header>
        <h1><i class="fas fa-gamepad"></i> مكتبة الألعاب</h1>
    </header>

    <!-- المحتوى الرئيسي (الصفحات) -->
    <main id="app-content">
        <!-- صفحة الألعاب القادمة -->
        <section id="upcoming" class="page active">
            <h2><i class="fas fa-calendar-alt"></i> الألعاب القادمة</h2>
            <div class="games-grid" id="upcoming-grid"></div>
        </section>

        <!-- صفحة الألعاب المختومة -->
        <section id="completed" class="page">
            <h2><i class="fas fa-trophy"></i> الألعاب المختومة</h2>
            <div class="games-grid" id="completed-grid"></div>
        </section>

        <!-- صفحة قائمة الانتظار -->
        <section id="wishlist" class="page">
            <h2><i class="fas fa-star"></i> قائمة الانتظار</h2>
            <div class="games-grid" id="wishlist-grid"></div>
        </section>

        <!-- صفحة الإحصائيات -->
        <section id="stats" class="page">
            <h2><i class="fas fa-chart-pie"></i> إحصائياتي</h2>
            <div class="stats-container" id="stats-container">
                <!-- سيتم ملؤها بالجافاسكربت -->
            </div>
        </section>
    </main>

    <!-- زر إضافة لعبة جديدة (عائم) -->
    <button class="fab" onclick="openModal()"><i class="fas fa-plus"></i></button>

    <!-- نافذة إضافة لعبة (Modal) -->
    <div id="game-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3>إضافة لعبة جديدة</h3>
            <form id="add-game-form">
                <label>حالة اللعبة:</label>
                <select id="game-status" onchange="toggleFormFields()">
                    <option value="upcoming">لعبة قادمة</option>
                    <option value="completed">تم التختيم</option>
                    <option value="wishlist">قائمة الانتظار</option>
                </select>

                <input type="text" id="game-title" placeholder="اسم اللعبة" required>
                <input type="url" id="game-cover" placeholder="رابط صورة الغلاف (URL)" required>
                <input type="text" id="game-genre" placeholder="التصنيف (أكشن، رعب، RPG...)" required>
                <input type="text" id="game-platforms" placeholder="المنصات (PS5, PC, Xbox)" required>

                <!-- حقول خاصة بالألعاب القادمة -->
                <div id="upcoming-fields">
                    <label>تاريخ الإصدار:</label>
                    <input type="date" id="game-release-date">
                </div>

                <!-- حقول خاصة بالألعاب المختومة -->
                <div id="completed-fields" style="display: none;">
                    <input type="number" id="game-playtime" placeholder="عدد ساعات اللعب">
                    <input type="number" id="game-rating" placeholder="التقييم (من 10)" min="1" max="10">
                    <textarea id="game-comment" placeholder="تعليقك الشخصي عن اللعبة"></textarea>
                    <label>تاريخ التختيم:</label>
                    <input type="date" id="game-completed-date">
                </div>

                <!-- حقول خاصة بقائمة الانتظار -->
                <div id="wishlist-fields" style="display: none;">
                    <label>الأولوية:</label>
                    <select id="game-priority">
                        <option value="🔥 متحمس جداً">🔥 متحمس جداً</option>
                        <option value="⭐ أنتظرها">⭐ أنتظرها</option>
                        <option value="⏳ لاحقاً">⏳ لاحقاً</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">حفظ اللعبة</button>
            </form>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active" onclick="switchPage('upcoming', this)"><i class="fas fa-calendar-alt"></i><span>القادمة</span></a>
        <a href="#" class="nav-item" onclick="switchPage('completed', this)"><i class="fas fa-check-double"></i><span>المختومة</span></a>
        <a href="#" class="nav-item" onclick="switchPage('wishlist', this)"><i class="fas fa-heart"></i><span>الانتظار</span></a>
        <a href="#" class="nav-item" onclick="switchPage('stats', this)"><i class="fas fa-chart-bar"></i><span>الإحصائيات</span></a>
    </nav>

    <script src="app.js"></script>
</body>
</html>
